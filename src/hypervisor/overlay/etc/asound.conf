# Charon Hypervisor: the voice and every guest share the first sound card through dmix.
# The guests go through the soft volume "Charon Guest" (lowered while the hypervisor speaks); the voice never does.
# Session 10 (user: "a normal PC with normal sound, not 500 ms"): the shared ring was 8192 frames (170 ms) - every
# sound waited that long in it. Now 2048 frames (43 ms) in periods of 512 (10.7 ms): measured clean under TCG in a
# VMware test host (charon-r410-hypervisor-results.txt, session 10). A client's buffer cannot be larger than this ring.
pcm.charonmix {
	type dmix
	ipc_key 47110
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		channels 2
		format S16_LE
		period_size 512
		buffer_size 2048
	}
}
pcm.charonvoice {
	type plug
	slave.pcm "charonmix"
}
pcm.charonguestvol {
	type softvol
	slave.pcm "charonmix"
	control {
		name "Charon Guest"
		card 0
	}
	min_dB -40.0
	max_dB 0.0
}
pcm.charonguest {
	type plug
	slave.pcm "charonguestvol"
}
pcm.!default {
	type plug
	slave.pcm "charonmix"
}

# 6q/(a): one slot per running machine, each with its own real mute switch (softvol resolution 2 = on/off, silence when
# off) in front of the shared guest volume; the ducking never touches these switches.
pcm.charonguest1 {
	type plug
	slave.pcm {
		type softvol
		slave.pcm "charonguestvol"
		control {
			name "Charon Machine 1"
			card 0
		}
		resolution 2
	}
}
