; Charon software catalogue. Format 1 (spec section 9.2).
; Every package id below was confirmed on 2026-11-24 against the primary index:
; Debian 13 trixie (ftp-master madison), Ubuntu 26.04 resolute (madison), Fedora 45 (mdapi),
; Arch (archlinux.org search), AUR (RPC v5), Flathub (appstream API), winget-pkgs (manifest folder).
; Evidence: work/r410a-evidence/verify-catalogue.txt.
; A package key may hold several names separated by single spaces; all of them are installed.
; An empty package key means: no verified id in that source. Comments only as whole lines.
; apt = Debian and Ubuntu; apt.ubuntu, when present, replaces apt on Ubuntu.
; a11y notes come only from fetched statements of the projects, NV Access or the Orca help;
; nothing here was tested with a screen reader in this project.

[catalogue]
format=1
date=2026-11-24

[set everyday]
name.en=Everyday
name.pl=Na co dzień
help.en=Browser, mail, office suite, players, messengers.
